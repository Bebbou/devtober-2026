<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Loop · un train sans fin</title>
    <meta name="description" content="Mes projets, dans un train de marchandises qui ne s'arrête jamais." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <a class="logo" href="#"><i></i>loop</a>
      <span class="stamp" id="stamp" aria-hidden="true">0 km/h</span>
    </header>

    <main id="stage">
      <!-- La ville au loin : défile plus lentement que le train (effet de profondeur) -->
      <div class="city" aria-hidden="true"><div id="city"></div></div>

      <!-- Le train : les conteneurs sont ajoutés par script.js -->
      <div class="train" id="train" aria-label="Mes projets"></div>

      <div class="rail" aria-hidden="true"><div class="ties" id="ties"></div></div>

      <p class="hint">molette ou glisser pour conduire · survoler pour arrêter · cliquer pour ouvrir</p>
    </main>

    <!-- La fiche d'un projet : un conteneur dont les portes s'ouvrent -->
    <dialog id="dlg" aria-labelledby="dName">
      <div class="panel">
        <div class="cargo">
          <p class="mark" id="dKind"></p>
          <h2 id="dName"></h2>
          <p id="dText"></p>
          <ul class="tags" id="dTags"></ul>
          <p class="links" id="dLinks"></p>
        </div>
        <i class="door l"></i>
        <i class="door r"></i>
        <button class="close" id="dClose" type="button">fermer</button>
      </div>
    </dialog>

    <script src="projects.js"></script>
    <script src="script.js"></script>
  </body>
</html>
