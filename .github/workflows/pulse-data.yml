# Collecte les données GitHub du dashboard Pulse toutes les 15 minutes
# et les publie dans status.json sur la branche "pulse-data".
#
# Le dashboard lit ce fichier au lieu d'appeler l'API GitHub depuis le navigateur
# des visiteurs (limitée à 60 appels/h par adresse IP, partagée sur un même réseau).
#
# Premier lancement : onglet Actions > pulse-data > Run workflow.

name: pulse-data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "01-Pulse/projects.js"
      - ".github/scripts/pulse-status.mjs"
      - ".github/workflows/pulse-data.yml"

# Deux lancements ne doivent jamais s'écraser l'un l'autre
concurrency:
  group: pulse-data
  cancel-in-progress: true

# Écriture nécessaire pour pousser la branche pulse-data
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collecter les données GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pulse-status.mjs out/status.json

      # Un seul commit, réécrit à chaque fois : la branche ne grossit pas
      - name: Publier sur la branche pulse-data
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b pulse-data
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add status.json
          git commit -q -m "données du $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pulse-data
