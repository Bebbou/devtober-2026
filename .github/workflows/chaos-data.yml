# Collecte les titres de presse toutes les heures, les classe et les place sur la carte de Chaos,
# puis les publie dans events.json sur la branche "chaos-data".
#
# Le fichier précédent est repris et complété : les flux ne gardent que quelques heures de titres,
# c'est ainsi que la carte garde 30 jours d'historique.
#
# Premier lancement : onglet Actions > chaos-data > Run workflow.
# Les feux par satellite demandent une clé NASA FIRMS gratuite, à ranger dans les secrets du dépôt
# sous le nom FIRMS_KEY (Settings > Secrets and variables > Actions). Sans clé, les feux sont ignorés.

name: chaos-data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/chaos-collect.mjs"
      - ".github/workflows/chaos-data.yml"

# Deux lancements ne doivent jamais s'écraser l'un l'autre
concurrency:
  group: chaos-data
  cancel-in-progress: false

# Écriture nécessaire pour pousser la branche chaos-data
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Absent au tout premier lancement : on repart de zéro
      - name: Reprendre les données précédentes
        run: |
          mkdir -p out
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/chaos-data/events.json" -o previous.json || rm -f previous.json

      - name: Collecter et classer les titres
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
        run: |
          if [ -f previous.json ]; then
            node .github/scripts/chaos-collect.mjs out/events.json previous.json
          else
            node .github/scripts/chaos-collect.mjs out/events.json
          fi

      # Un seul commit, réécrit à chaque fois : la branche ne grossit pas
      - name: Publier sur la branche chaos-data
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b chaos-data
          git config user.name "chaos-bot"
          git config user.email "chaos-bot@users.noreply.github.com"
          git add events.json
          git commit -q -m "données du $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chaos-data
